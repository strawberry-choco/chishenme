<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chi Shen Me</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111018;
      --panel: #1c1a27;
      --panel-soft: #262337;
      --text: #fff8ea;
      --muted: #bcb4cf;
      --accent: #ffbe3d;
      --accent-dark: #7a3d0d;
      --danger: #ff6b6b;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(255, 190, 61, 0.18), transparent 32rem),
        radial-gradient(circle at bottom right, rgba(255, 107, 107, 0.14), transparent 30rem),
        var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(920px, 100%);
      display: grid;
      gap: 24px;
    }

    .hero,
    .panel {
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      background: rgba(28, 26, 39, 0.86);
      box-shadow: 0 24px 80px var(--shadow);
      backdrop-filter: blur(12px);
    }

    .hero {
      padding: clamp(18px, 3vw, 28px);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.35rem, 7vw, 4.6rem);
      letter-spacing: -0.07em;
      line-height: 0.95;
    }

    .subtitle {
      max-width: 620px;
      margin: 10px auto 0;
      color: var(--muted);
      font-size: clamp(0.95rem, 1.6vw, 1.05rem);
      line-height: 1.45;
    }

    .content {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 360px);
      gap: 24px;
    }

    .panel {
      padding: 24px;
    }

    .wheel-panel {
      display: grid;
      gap: 22px;
      place-items: center;
    }

    .wheel-wrap {
      width: min(420px, 100%);
      aspect-ratio: 1;
      position: relative;
      display: grid;
      place-items: center;
    }

    .pointer {
      position: absolute;
      top: 50%;
      right: -3px;
      z-index: 3;
      width: 44px;
      height: 34px;
      transform: translateY(-50%);
      clip-path: polygon(0 50%, 100% 0, 100% 100%);
      background: var(--accent);
      filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.45));
    }

    .wheel {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      position: relative;
      overflow: hidden;
      background: var(--wheel-background, conic-gradient(#32263e, #17151f));
      border: 14px solid #0d0c12;
      box-shadow:
        inset 0 0 0 10px rgba(255, 255, 255, 0.06),
        inset 0 0 44px rgba(0, 0, 0, 0.7),
        0 24px 50px var(--shadow);
      transform: rotate(var(--wheel-rotation, 0deg));
      transition: transform 4.2s cubic-bezier(0.12, 0.72, 0.13, 1);
    }

    .wheel-label {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 36%;
      color: #fff8ea;
      font-size: clamp(0.72rem, 1.7vw, 0.98rem);
      font-weight: 900;
      line-height: 1.15;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.72);
      transform-origin: 0 50%;
      transform: rotate(var(--label-angle)) translate(42%, -42%);
    }

    button {
      border: 0;
      border-radius: 999px;
      font: inherit;
      cursor: pointer;
      padding: 14px 20px;
      background: var(--accent);
      color: #231506;
      font-weight: 800;
      transition: transform 160ms ease, opacity 160ms ease, background 160ms ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      background: #ffd06a;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .spin-button {
      min-width: 180px;
      padding: 16px 28px;
      font-size: 1.1rem;
    }

    .status {
      min-height: 1.5em;
      margin: 0;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    .status.strong {
      color: var(--accent);
      font-weight: 800;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 16px;
    }

    h2 {
      margin: 0;
      font-size: 1.2rem;
    }

    .count {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .items {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 12px 12px 16px;
      border-radius: 18px;
      background: var(--panel-soft);
    }

    .item span {
      overflow-wrap: anywhere;
    }

    @media (max-width: 760px) {
      body {
        padding: 16px;
      }

      .content {
        grid-template-columns: 1fr;
      }
      button,
      .spin-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="page-title">
      <h1 id="page-title">Chi Shen Me</h1>
      <p class="subtitle">Spin the wheel and let chance pick today's meal from the built-in options.</p>
    </section>

    <section class="content" aria-label="Spinning wheel picker">
      <div class="panel wheel-panel">
        <div class="wheel-wrap" aria-live="polite">
          <div class="pointer" aria-hidden="true"></div>
          <div id="wheel" class="wheel"></div>
        </div>
        <button id="spin-button" class="spin-button" type="button">Spin</button>
        <p id="status" class="status">Ready to spin.</p>
      </div>

      <aside class="panel">
        <div class="list-header">
          <h2>Items</h2>
          <span id="item-count" class="count">0 options</span>
        </div>

        <ul id="items" class="items"></ul>
      </aside>
    </section>
  </main>

  <script>
    const defaultItems = [
      '劲脆烧肉',
      '猪杂、粿条',
      '老香鸡',
      '蒙自源',
      '饺子',
      '酸菜鱼',
      '狮头鹅',
      '日式'
    ].map((text, index) => ({ id: String(index), text }));

    const spinButton = document.getElementById('spin-button');
    const wheel = document.getElementById('wheel');
    const status = document.getElementById('status');
    const itemList = document.getElementById('items');
    const itemCount = document.getElementById('item-count');

    const items = defaultItems;
    let spinning = false;
    let selectedId = null;
    let currentRotation = 0;

    function setStatus(message, strong = false) {
      status.textContent = message;
      status.classList.toggle('strong', strong);
    }

    function setControlsDisabled(disabled) {
      spinButton.disabled = disabled || items.length === 0;
    }

    function renderItems() {
      itemList.textContent = '';

      for (const item of items) {
        const li = document.createElement('li');
        li.className = 'item';

        const text = document.createElement('span');
        text.textContent = item.text;

        li.append(text);
        itemList.append(li);
      }

      itemCount.textContent = `${items.length} options`;
      spinButton.disabled = spinning || items.length === 0;
      renderWheel();
    }

    function colorForIndex(index) {
      const colors = ['#d95d39', '#f2af29', '#3a86ff', '#8338ec', '#06d6a0', '#ef476f', '#118ab2', '#f77f00'];
      return colors[index % colors.length];
    }

    function renderWheel() {
      wheel.textContent = '';

      if (items.length === 0) {
        wheel.style.setProperty('--wheel-background', 'conic-gradient(#32263e, #17151f)');
        return;
      }

      const segmentSize = 360 / items.length;
      const gradient = items.map((item, index) => {
        const start = index * segmentSize;
        const end = start + segmentSize;
        return `${colorForIndex(index)} ${start}deg ${end}deg`;
      }).join(', ');

      wheel.style.setProperty('--wheel-background', `conic-gradient(from ${-segmentSize / 2}deg, ${gradient})`);

      items.forEach((item, index) => {
        const label = document.createElement('div');
        label.className = 'wheel-label';
        label.textContent = item.text;
        label.style.setProperty('--label-angle', `${index * segmentSize - 90}deg`);
        wheel.append(label);
      });
    }

    function updateResultPlaceholder() {
      setStatus('Ready to spin.');
    }

    function pickWinningIndex() {
      return Math.floor(Math.random() * items.length);
    }

    function spinWheel() {
      if (spinning) {
        return;
      }

      spinning = true;
      const winningIndex = pickWinningIndex();
      const winningItem = items[winningIndex];
      const segmentSize = 360 / items.length;
      const segmentCenter = winningIndex * segmentSize;
      const rightSideAngle = 90;
      const fullTurns = 5 + Math.floor(Math.random() * 3);
      const currentSegmentAngle = (currentRotation + segmentCenter) % 360;
      const rotationToRightSide = (rightSideAngle - currentSegmentAngle + 360) % 360;
      currentRotation += fullTurns * 360 + rotationToRightSide;

      setControlsDisabled(true);
      setStatus('Spinning...');
      wheel.style.setProperty('--wheel-rotation', `${currentRotation}deg`);

      window.setTimeout(() => {
        selectedId = winningItem.id;
        spinning = false;
        setControlsDisabled(false);
        setStatus(`Chosen: ${winningItem.text}`, true);
      }, 4300);
    }

    spinButton.addEventListener('click', spinWheel);

    function init() {
      renderItems();
      updateResultPlaceholder();
    }

    init();
  </script>
</body>
</html>
